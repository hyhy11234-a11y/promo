<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>행사계획 체커</title>
<style>
:root{
  --bg:#f4f3ef; --surface:#fcfcfb; --card:#ffffff; --line:#e4e2dc; --line2:#d6d3cb;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#7d7b75;
  --accent:#2a78d6; --accent-d:#1c5cab; --accent-l:#e7f0fc;
  --good:#0ca30c; --good-t:#006300; --good-l:#e6f5e6;
  --bad:#d03b3b; --bad-t:#a52a2a; --bad-l:#fbe9e9;
  --warn:#fab219; --warn-t:#7a5200; --warn-l:#fff4d9;
  --muted-bar:#c9c6bd;
  --r:10px; --sh:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:12px}
.hide{display:none!important}

/* header */
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1280px;margin:0 auto}
.brand{font-weight:800;font-size:16px;letter-spacing:-.3px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--ink3);letter-spacing:0}
.hspace{flex:1}
.chip-user{border:1px solid var(--line2);background:var(--surface);border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.conn{font-size:11px;padding:3px 8px;border-radius:20px;white-space:nowrap}
.conn.on{background:var(--good-l);color:var(--good-t)} .conn.off{background:#eeece6;color:var(--ink2)}
nav.tabs{display:flex;gap:2px;max-width:1280px;margin:0 auto;padding:0 12px}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink2);font-weight:600;border-bottom:2px solid transparent}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:16px 16px 96px}
.outbox{background:var(--warn-l);color:var(--warn-t);border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:14px}
.filters label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 10px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
select,input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],input[type=url],input[type=password],textarea{
  border:1px solid var(--line2);border-radius:8px;background:var(--card);padding:7px 9px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;white-space:nowrap;min-height:36px}
.btn:hover{background:var(--surface)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2b2b2b}
.btn.good{background:var(--good-t);border-color:var(--good-t);color:#fff}
.btn.bad{color:var(--bad-t);border-color:#e9b9b9}
.btn.sm{padding:5px 9px;font-size:12px;min-height:30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* cards & kpi */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sec{padding:16px;margin-bottom:14px}
.sec h3{margin:0 0 2px;font-size:15px}
.sec .sub{margin:0 0 12px;font-size:12px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{padding:12px 14px}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--ink2);margin-left:2px}
.kpi .s{font-size:11px;color:var(--ink3);margin-top:2px}
.alerts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* badges */
.b{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.b.ok{background:var(--good-l);color:var(--good-t)}
.b.no{background:var(--bad-l);color:var(--bad-t)}
.b.na{background:#eeece6;color:var(--ink2)}
.b.wa{background:var(--warn-l);color:var(--warn-t)}
.st{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;border:1px solid}
.st.s계획{color:var(--accent-d);border-color:#b7d3f6;background:var(--accent-l)}
.st.s승인{color:var(--good-t);border-color:#b5dfb5;background:var(--good-l)}
.st.s최종승인{color:#fff;border-color:var(--good-t);background:var(--good-t)}
.it .ck{width:20px;height:20px;margin:0 8px 0 0;flex:0 0 auto;cursor:pointer}
.bulk{position:sticky;top:96px;z-index:20;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulk .btn{min-height:32px}
.tl{list-style:none;margin:6px 0 0;padding:0;font-size:12px}
.tl li{padding:4px 0;border-bottom:1px dashed var(--line);color:var(--ink2)}
.tl li:last-child{border-bottom:0}
.st.s반려{color:var(--bad-t);border-color:#efc2c2;background:var(--bad-l)}
.st.s마감{color:#fff;border-color:#3a3936;background:#3a3936}

/* bars (html charts) */
.hb{display:grid;grid-template-columns:minmax(70px,140px) 1fr auto;gap:6px 10px;align-items:center}
.hb .lab{font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:14px;background:#efede8;border-radius:0 4px 4px 0;position:relative}
.hb .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hb .val{font-size:12px;color:var(--ink2);text-align:right;min-width:54px}
.cols{display:flex;align-items:flex-end;gap:10px;height:180px;padding:8px 4px 0;border-bottom:1px solid var(--line2);position:relative}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:default}
.cols .c .bar{width:min(46px,80%);border-radius:4px 4px 0 0;background:var(--accent);min-height:1px}
.cols .c .bar.mute{background:var(--muted-bar)}
.cols .c .cv{font-size:12px;color:var(--ink2);margin-bottom:3px}
.cols-x{display:flex;gap:10px;padding:5px 4px 0}
.cols-x div{flex:1;text-align:center;font-size:11px;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:100;pointer-events:none;background:#1f1f1d;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;line-height:1.45;max-width:260px;display:none;white-space:pre-line}

/* table */
.tw{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card)}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--surface);font-size:12px;color:var(--ink2);font-weight:700;position:sticky;top:0;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#faf9f6}
th .ar{font-size:10px;margin-left:3px;color:var(--ink3)}

/* list */
.lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.it{padding:12px 14px;cursor:pointer;transition:border-color .15s}
.it:hover{border-color:var(--ink3)}
.it .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.it .nm{font-weight:700;font-size:15px}
.it .meta{font-size:12px;color:var(--ink2);margin-top:3px}
.it .bd{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.empty{padding:40px 16px;text-align:center;color:var(--ink2)}

/* modal */
#ov{position:fixed;inset:0;background:rgba(20,20,18,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
#ov.on{display:flex}
.md{background:var(--bg);border-radius:14px;width:100%;max-width:1000px;box-shadow:0 10px 40px rgba(0,0,0,.25);margin-bottom:40px}
.md .mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);border-radius:14px 14px 0 0;position:sticky;top:-24px;z-index:2}
.md .mh h2{margin:0;font-size:16px;flex:1}
.md .mb{padding:14px 16px}
.md .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:var(--card);border-radius:0 0 14px 14px;position:sticky;bottom:-24px;flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;color:var(--ink2)}
.fs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.fs h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.fs h4 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;color:var(--ink2);font-weight:600}
.f>span b{color:var(--bad)}
.f input,.f select{width:100%}
.span2{grid-column:span 2} .span4{grid-column:1/-1}
.ln{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface)}
.ln .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ln .lg{display:grid;grid-template-columns:2fr 1.05fr 1.75fr 1fr 1fr;gap:8px}
.calc{margin-top:9px;font-size:12px;color:var(--ink2);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding-top:9px;border-top:1px dashed var(--line2)}
.calc b{color:var(--ink)}
.qty{display:flex;gap:4px}
.qty input{flex:1;min-width:58px}
.qty select{width:auto;flex:0 0 auto}
.ph{display:flex;gap:8px;flex-wrap:wrap}
.ph .th{width:86px;height:86px;border-radius:8px;overflow:hidden;position:relative;background:#e8e6e0;display:grid;place-items:center;cursor:zoom-in}
.ph .th img{width:100%;height:100%;object-fit:cover}
.ph .th .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px;line-height:22px;padding:0}
.ph .add{width:86px;height:86px;border:1.5px dashed var(--line2);border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);font-size:12px;text-align:center;background:var(--card)}
.dl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px}
.dl div span{display:block;font-size:12px;color:var(--ink2)}
.dl div b{font-weight:600}
.review{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb.on{display:flex} #lb img{max-width:95vw;max-height:92vh}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f1f1d;color:#fff;padding:10px 16px;border-radius:8px;z-index:120;font-size:13px;display:none;max-width:90vw}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#loading{position:fixed;top:64px;right:16px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;box-shadow:var(--sh);display:none}
.set{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px}
.note{font-size:12px;color:var(--ink2);line-height:1.6}
.warnbox{background:var(--warn-l);color:var(--warn-t);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:8px}
.fab{display:none}

@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .grid2,.set{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr 1fr}
  .ln .lg{grid-template-columns:1fr 1fr}
  .ln .lg .pf{grid-column:1/-1}
  .dl{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  html,body{font-size:15px}
  .hbar{padding:8px 12px;gap:6px}
  .brand small{display:none}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:0 0 env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;border-bottom:0;border-top:2px solid transparent;padding:12px 4px;font-size:13px}
  nav.tabs button.on{border-top-color:var(--ink)}
  main{padding:12px 10px 90px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:21px}
  .lst{grid-template-columns:1fr}
  #ov{padding:0}
  .md{border-radius:0;min-height:100%;margin:0}
  .md .mh{border-radius:0;top:0} .md .mf{border-radius:0;bottom:0}
  .fg{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .qty{flex-direction:column}
  .qty select{width:100%}
  .filters{padding:8px}
  .hb{grid-template-columns:84px 1fr auto}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">행사계획 체커<small>대리점 월간 행사계획 점검</small></div>
    <div class="hspace"></div>
    <span id="conn" class="conn off">로컬</span>
    <button class="chip-user" id="userChip" onclick="openUser()">사용자 선택</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="dash" class="on">대시보드</button>
    <button data-v="list">행사목록</button>
    <button data-v="new">+ 계획등록</button>
    <button data-v="set">설정</button>
  </nav>
</header>
<div id="loading"><span class="spin"></span> 불러오는 중</div>
<main id="main"></main>
<div id="ov"></div>
<div id="lb" onclick="this.classList.remove('on')"><img alt=""></div>
<div id="tip"></div>
<div id="toast"></div>
<datalist id="dl-prod"></datalist>

<script>
/* =========================================================
   설정값 (판정 기준) — 여기만 바꾸면 전체에 반영됩니다
   ========================================================= */
const RULE = {
  RATE_MIN: 0.20,     // 행사율 20% 이상
  MARGIN_MAX: 0.15,   // 대리점 마진율 15% 이하
  BANDS: [            // 행사율 구간
    { k: '10% 미만', max: 0.10 },
    { k: '10~20%', max: 0.20 },
    { k: '20~30%', max: 0.30 },
    { k: '30~40%', max: 0.40 },
    { k: '40~50%', max: 0.50 },
    { k: '50% 이상', max: Infinity }
  ]
};
const STATUSES = ['계획', '승인', '최종승인', '반려', '마감'];
const ST_LABEL = { '계획': '담당 검토 대기', '승인': '담당승인', '최종승인': '최종승인', '반려': '반려', '마감': '마감' };
const stl = s => ST_LABEL[s] || s;
// 폐점·통합된 대리점: 마스터 엑셀을 다시 올려도 오른쪽 대리점으로 바꿔 읽음
const DEALER_ALIAS = { '남구미': '북구미' };
const CDN = {
  xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  h2c: 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',

function addM(m, n) { const [y, mo] = m.split('-').map(Number); return ym(new Date(y, mo - 1 + n, 1)); }
function monthsBetween(a, b) { const out = []; let m = a; while (m <= b && out.length < 60) { out.push(m); m = addM(m, 1); } return out; }

  const p = S.pmap.get(l.product);

  const o = { k, known: !!p, warn: [] };
  if (p && k) { o.normal = p.c / p.q * k; o.out = p.u * k; }

  if (o.rate != null && o.rate < 0) o.warn.push('행사가가 정상가보다 높음');

  o.qtyEa = qty == null || !k ? null : (ea ? qty : qty * k);
  o.soldEa = sold == null || !k ? null : (ea ? sold : sold * k);
  o.turn = o.qtyEa && o.soldEa != null ? o.soldEa / o.qtyEa : null;
  o.inAmt = qty != null && inp && k ? (ea ? qty / k * inp : qty * inp) : null;

}

/* ---------- 저장소 (로컬 IndexedDB / 구글시트) ---------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((ok, no) => {
      const q = indexedDB.open('promo_checker', 1);
      q.onupgradeneeded = () => { const d = q.result; d.createObjectStore('records', { keyPath: 'id' }); d.createObjectStore('photos', { keyPath: 'id' }); };
      q.onsuccess = () => { this.db = q.result; ok(this.db); };
      q.onerror = () => no(q.error);
    });
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((ok, no) => {
      const t = d.transaction(store, mode), s = t.objectStore(store);
      const q = fn(s); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error);
    });
  },
  all(s) { return this.tx(s, 'readonly', st => st.getAll()); },
  get(s, k) { return this.tx(s, 'readonly', st => st.get(k)); },
  put(s, v) { return this.tx(s, 'readwrite', st => st.put(v)); },
  del(s, k) { return this.tx(s, 'readwrite', st => st.delete(k)); }
};
// Apps Script 웹 앱 주소로 열었을 때는 google.script.run 으로 서버와 통신

    .withFailureHandler(e => no(new Error((e && e.message) || String(e))))
    .api(body));
}
const API = {
  get on() { return !!(inGas() || S.cfg.url); },
  async call(action, payload = {}) {
    const u = S.user;
    const auth = payload.auth || (u && u.pin ? { role: u.role, name: u.name, pin: u.pin } : null);
    const body = JSON.stringify({ ...payload, auth, action, token: S.cfg.token || DEFAULT_CFG.token });
    let j;
    if (inGas()) j = await gsr(body);
    else {
      const res = await fetch(S.cfg.url, { method: 'POST', body });
      if (!res.ok) throw new Error('서버 응답 오류 ' + res.status);
      j = await res.json();
    }
    if (!j.ok) {
      if (j.auth && action !== 'login') { S.user = null; save('user', null); updUser(); setTimeout(openUser, 50); }
      throw new Error(j.error || '요청 실패');

  }
};
function forSheet(rec) {

  out.lines = out.lines.map((l, i) => { const c = d.lines[i].c; return { ...l, _c: { normal: c.normal, out: c.out, rate: c.rate, band: c.band, margin: c.margin, verdict: c.verdict, reasons: c.reasons, turn: c.turn } }; });

}
function clean(rec) { const r = { ...rec }; delete r._sheet; r.lines = (r.lines || []).map(l => { const x = { ...l }; delete x._c; return x; }); return r; }
const Repo = {
  async list(from, to) {
    if (API.on) return (await API.call('list', { from, to })).records.map(clean);
    return (await IDB.all('records')).filter(r => r.month >= from && r.month <= to);
  },
  async save(rec, base) {
    rec.updatedBy = userLabel();
    if (API.on) {
      const j = await API.call('upsert', { rec: forSheet(rec), base });
      if (j.conflict) return { conflict: true, server: clean(j.server) };

    }

  },
  async saveMany(recs) {
    if (API.on) { for (let i = 0; i < recs.length; i += 15) await API.call('upsertMany', { recs: recs.slice(i, i + 15).map(forSheet) }); return; }
    for (const r of recs) { r.updatedAt = new Date().toISOString(); await IDB.put('records', r); }
  },
  async setStatus(rec, status, comment) {
    if (API.on) { const j = await API.call('setStatus', { id: rec.id, status, comment }); return clean(j.rec); }

    const stamp = { by: userLabel(), at: now, result: status, comment: comment || '' };

    if (u.role === 'admin' && (status === '최종승인' || status === '반려') && rec.status !== '마감') next.final = stamp;
    next.log = [...(rec.log || []), { at: now, by: userLabel(), role: u.role, from: rec.status, to: status, comment: comment || '' }].slice(-30);

    if (API.on) { const j = await API.call('setStatus', { ids: recs.map(r => r.id), status, comment }); return j.recs.map(clean); }

  },

  async upload(dataURL) {

    return d;
  }
};

/* ---------- 데이터 로딩 ---------- */
async function ensure(from, to, force) {
  const need = monthsBetween(from, to).filter(m => force || !S.loaded.has(m));
  if (!need.length) return;
  busy(true);
  try {
    const recs = await Repo.list(need[0], need[need.length - 1]);
    for (const [id, r] of S.recs) if (need.includes(r.month)) S.recs.delete(id);
    recs.forEach(r => S.recs.set(r.id, r));
    outbox().forEach(r => S.recs.set(r.id, r));
    need.forEach(m => S.loaded.add(m));
  } catch (e) { toast('불러오기 실패: ' + e.message, 4000); }
  finally { busy(false); }
}
function scopeRecs(from, to) {
  const u = S.user || {};
  return [...S.recs.values()].filter(r => {
    if (r.month < from || r.month > to) return false;
    if (u.role === 'dealer' && r.dealer !== u.name) return false;
    const di = dinfo(r.dealer);
    if (S.f.region && di.g !== S.f.region) return false;
    if (S.f.owner && di.o !== S.f.owner) return false;
    if (S.f.dealer && r.dealer !== S.f.dealer) return false;
    return true;
  });
}

/* ---------- 집계 ---------- */
function aggregate(recs) {
  const D = recs.map(derive);
  const lines = D.flatMap(d => d.lines.map(l => ({ ...l, d })));
  const sum = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);
  const turnOf = ls => { const w = ls.filter(l => l.c.soldEa != null && l.c.qtyEa); const q = sum(w, l => l.c.qtyEa); return q ? sum(w, l => l.c.soldEa) / q : null; };
  // 범위 내 대리점 (필터 반영)
  const u = S.user || {};
  let scopeDealers = [...S.dmap.values()].filter(d => (!S.f.region || d.g === S.f.region) && (!S.f.owner || d.o === S.f.owner) && (!S.f.dealer || d.n === S.f.dealer));
  if (u.role === 'dealer') scopeDealers = scopeDealers.filter(d => d.n === u.name);
  const judged = lines.filter(l => l.c.verdict !== '미판정');
  const k = {
    recs: D.length,
    dealers: new Set(D.map(d => d.r.dealer)).size, dealerTotal: scopeDealers.length,
    stores: new Set(D.map(d => d.r.dealer + '|' + d.r.store)).size,
    products: new Set(lines.map(l => l.product).filter(Boolean)).size,
    lines: lines.length,
    ok: judged.filter(l => l.c.verdict === '지원').length, judged: judged.length,
    turn: turnOf(lines),
    noProof: D.filter(d => d.noEv || d.noInv).length,
    late: D.filter(d => d.late).length,
    pending: D.filter(d => d.r.status === '계획').length,
    waitFinal: D.filter(d => d.r.status === '승인').length,
    finalOk: D.filter(d => d.r.status === '최종승인' || d.r.status === '마감').length,
    inAmt: sum(lines, l => l.c.inAmt)
  };
  // 대리점별
  const byDealer = scopeDealers.map(di => {
    const dd = D.filter(d => d.r.dealer === di.n), ls = lines.filter(l => l.d.r.dealer === di.n);
    return {
      dealer: di.n, owner: di.o, region: di.g, recs: dd.length,
      stores: new Set(dd.map(d => d.r.store)).size, products: new Set(ls.map(l => l.product)).size,
      ok: ls.filter(l => l.c.verdict === '지원').length, no: ls.filter(l => l.c.verdict === '불가').length,
      qty: sum(ls, l => l.c.qtyEa) || null, sold: ls.some(l => l.c.soldEa != null) ? sum(ls, l => l.c.soldEa) : null,
      turn: turnOf(ls), inAmt: sum(ls, l => l.c.inAmt) || null
    };
  });
  // 담당별
  const byOwner = [...new Set(scopeDealers.map(d => d.o))].sort().map(o => {
    const ds = byDealer.filter(x => x.owner === o), part = ds.filter(x => x.recs > 0);
    const ls = lines.filter(l => l.d.di.o === o);
    return { owner: o, total: ds.length, part: part.length, rate: ds.length ? part.length / ds.length : null, stores: sum(part, x => x.stores), recs: sum(part, x => x.recs), turn: turnOf(ls) };
  });
  // 품목별
  const pm = new Map();
  lines.forEach(l => { if (!l.product) return; if (!pm.has(l.product)) pm.set(l.product, []); pm.get(l.product).push(l); });
  const byProduct = [...pm].map(([p, ls]) => {
    const rs = ls.filter(l => l.c.rate != null);
    return {
      product: p, stores: new Set(ls.map(l => l.d.r.dealer + '|' + l.d.r.store)).size, dealers: new Set(ls.map(l => l.d.r.dealer)).size,
      ok: ls.filter(l => l.c.verdict === '지원').length, no: ls.filter(l => l.c.verdict === '불가').length,
      qty: sum(ls, l => l.c.qtyEa) || null, sold: ls.some(l => l.c.soldEa != null) ? sum(ls, l => l.c.soldEa) : null,
      turn: turnOf(ls), rate: rs.length ? sum(rs, l => l.c.rate) / rs.length : null
    };
  });
  // 행사율 구간
  const bands = RULE.BANDS.map(b => ({ k: b.k, max: b.max, n: lines.filter(l => l.c.band === b.k).length }));
  return { D, lines, k, byDealer, byOwner, byProduct, bands };
}

async function viewDash() {
  const p = period();
  const trendFrom = addM(p.to, -5);
  await ensure(trendFrom < p.from ? trendFrom : p.from, p.to);
  const A = aggregate(scopeRecs(p.from, p.to));
  const k = A.k;
  const perLabel = p.from === p.to ? p.to.replace('-', '년 ') + '월' : `${p.from.replace('-', '.')} ~ ${p.to.replace('-', '.')} 누계`;
  // 월별 추이
  const trend = monthsBetween(trendFrom, p.to).map(m => {
    const a = aggregate(scopeRecs(m, m));
    return { l: m.slice(5) + '월', v: a.k.stores, t: a.k.stores, tip: `${m}\n참여 점포 ${a.k.stores}곳 · 행사 ${a.k.recs}건\n참여 대리점 ${a.k.dealers}곳 · 회전율 ${pct(a.k.turn)}` };
  });
  const dealerRows = S.showAllDealers ? A.byDealer : A.byDealer.filter(r => r.recs > 0);
  const topP = [...A.byProduct].sort((a, b) => b.stores - a.stores).slice(0, 10);
  $('#main').innerHTML = `
  ${filterBar(`<button class="btn sm" id="xXlsx">엑셀</button><button class="btn sm" id="xPdf">PDF</button><button class="btn sm" id="xJpg">JPG</button>`)}
  <div id="dashCap">
  <div class="row" style="margin:0 0 10px;justify-content:space-between"><div><b style="font-size:17px">${esc(perLabel)}</b> <span class="muted small">${S.f.region || ''} ${S.f.owner || ''} ${S.f.dealer || ''}</span></div>${HV() ? '' : `<span class="faint small">기준: 행사율 ≥ ${RULE.RATE_MIN * 100}% 그리고 대리점 마진율 ≤ ${RULE.MARGIN_MAX * 100}% → 지원</span>`}</div>
  <div class="kpis">
    <div class="card kpi"><div class="l">행사 건수</div><div class="v num">${k.recs}<small>건</small></div><div class="s">품목 ${k.lines}개 라인</div></div>
    <div class="card kpi"><div class="l">참여 대리점</div><div class="v num">${k.dealers}<small>/ ${k.dealerTotal}</small></div><div class="s">참여율 ${pct(k.dealerTotal ? k.dealers / k.dealerTotal : null, 0)}</div></div>
    <div class="card kpi"><div class="l">참여 점포</div><div class="v num">${k.stores}<small>곳</small></div><div class="s">입고금액 ${won(k.inAmt)}원</div></div>
    <div class="card kpi"><div class="l">참여 품목</div><div class="v num">${k.products}<small>종</small></div><div class="s">전체 ${S.master.products.length}종 중</div></div>
    ${HV() ? `<div class="card kpi"><div class="l">최종승인</div><div class="v num">${k.finalOk}<small>/ ${k.recs}건</small></div><div class="s">담당 검토 대기 ${k.pending}건</div></div>`
    : `<div class="card kpi"><div class="l">지원 판정</div><div class="v num">${pct(k.judged ? k.ok / k.judged : null, 0)}</div><div class="s">지원 ${k.ok} · 불가 ${k.judged - k.ok}</div></div>`}
    <div class="card kpi"><div class="l">행사 회전율</div><div class="v num">${pct(k.turn, 0)}</div><div class="s">판매수량 ÷ 입고수량</div></div>
  </div>
  <div class="alerts">
    ${k.pending ? `<span class="b na" data-go="계획">담당 검토 대기 ${k.pending}건 ›</span>` : ''}
    ${k.waitFinal ? `<span class="b ${(S.user || {}).role === 'admin' ? 'wa' : 'na'}" data-go="승인">최종승인 대기 ${k.waitFinal}건 ›</span>` : ''}
    ${k.finalOk ? `<span class="b ok" data-go="최종승인">최종승인 ${k.finalOk}건 ›</span>` : ''}
    ${k.noProof ? `<span class="b wa">⚠ 증빙 누락 ${k.noProof}건</span>` : ''}
    ${k.late ? `<span class="b no">⏱ 행사 종료 후 결과 미입력 ${k.late}건</span>` : ''}
  </div>
  <div class="grid2">
    <div class="card sec"><h3>담당별 행사참여 대리점</h3><p class="sub">담당 대리점 중 이번 기간에 행사계획을 올린 대리점 비율</p>
      ${hbars(A.byOwner.map(o => ({ l: o.owner, v: o.rate || 0, t: `${o.part}/${o.total}곳 · ${pct(o.rate, 0)}`, tip: `${o.owner}\n참여 대리점 ${o.part}/${o.total}곳\n참여 점포 ${o.stores}곳 · 행사 ${o.recs}건\n회전율 ${pct(o.turn)}` })), { max: 1 })}
    </div>
    <div class="card sec"><h3>행사율 구간 분포</h3><p class="sub">품목 라인 기준 · 정상 소비자가 대비 할인율</p>
      ${HV() ? '' : `<div class="legend"><span><i style="background:var(--accent)"></i>지원 기준(20%) 이상</span><span><i style="background:var(--muted-bar)"></i>기준 미달</span></div>`}
      ${columns(A.bands.map(b => ({ l: b.k, v: b.n, t: b.n, mute: !HV() && b.max <= RULE.RATE_MIN, tip: `${b.k}: ${b.n}개 라인` })))}
    </div>
    <div class="card sec"><h3>월별 참여 점포 추이</h3><p class="sub">최근 6개월 · 막대에 마우스를 올리면 상세</p>${columns(trend)}</div>
    <div class="card sec"><h3>참여 품목 TOP 10</h3><p class="sub">행사를 건 점포 수 기준</p>
      ${hbars(topP.map(r => ({ l: r.product, v: r.stores, t: `${r.stores}곳`, tip: `${r.product}\n점포 ${r.stores}곳 · 대리점 ${r.dealers}곳\n평균 행사율 ${pct(r.rate)} · 회전율 ${pct(r.turn)}` })))}
    </div>
  </div>
  <div class="card sec"><div class="row" style="justify-content:space-between"><div><h3>대리점별 행사 현황</h3><p class="sub">수량은 낱개(1입) 환산 · 열 제목을 누르면 정렬</p></div>
    <label class="small muted"><input type="checkbox" id="allD" ${S.showAllDealers ? 'checked' : ''}> 미참여 대리점 포함</label></div>
    ${table('dealer', [
      { k: 'dealer', t: '대리점' }, { k: 'owner', t: '담당' }, { k: 'region', t: '권역' },
      { k: 'stores', t: '참여점포', r: 1 }, { k: 'products', t: '품목수', r: 1 }, { k: 'recs', t: '행사건', r: 1 },
      ...(HV() ? [] : [{ k: 'ok', t: '지원', r: 1 }, { k: 'no', t: '불가', r: 1 }]),
      { k: 'qty', t: '입고수량', r: 1, f: n0 }, { k: 'sold', t: '판매수량', r: 1, f: n0 }, { k: 'turn', t: '회전율', r: 1, f: v => pct(v) },
      { k: 'inAmt', t: '입고금액', r: 1, f: won }], dealerRows, { k: 'stores', d: -1 })}
  </div>
  <div class="grid2">
    <div class="card sec"><h3>담당별 요약</h3><p class="sub">&nbsp;</p>
      ${table('owner', [{ k: 'owner', t: '담당' }, { k: 'part', t: '참여대리점', r: 1 }, { k: 'total', t: '담당대리점', r: 1 }, { k: 'rate', t: '참여율', r: 1, f: v => pct(v, 0) }, { k: 'stores', t: '참여점포', r: 1 }, { k: 'recs', t: '행사건', r: 1 }, { k: 'turn', t: '회전율', r: 1, f: v => pct(v) }], A.byOwner, { k: 'owner', d: 1 })}
    </div>
    <div class="card sec"><h3>품목별 현황</h3><p class="sub">수량은 낱개(1입) 환산</p>
      ${table('prod', [{ k: 'product', t: '품목' }, { k: 'stores', t: '점포', r: 1 }, ...(HV() ? [] : [{ k: 'ok', t: '지원', r: 1 }, { k: 'no', t: '불가', r: 1 }]), { k: 'rate', t: '평균행사율', r: 1, f: v => pct(v) }, { k: 'sold', t: '판매', r: 1, f: n0 }, { k: 'turn', t: '회전율', r: 1, f: v => pct(v) }], A.byProduct, { k: 'stores', d: -1 })}
    </div>
  </div>
  </div>`;
  bindFilterBar();
  $('#allD').onchange = e => { S.showAllDealers = e.target.checked; render(); };
  $('#xXlsx').onclick = () => exportXlsx(A, perLabel);
  $('#xPdf').onclick = () => exportImage('#dashCap', '행사계획_대시보드_' + perLabel, 'pdf');
  $('#xJpg').onclick = () => exportImage('#dashCap', '행사계획_대시보드_' + perLabel, 'jpg');
  $$('[data-go]').forEach(b => { b.style.cursor = 'pointer'; b.onclick = () => { S.lf = { status: b.dataset.go, verdict: '', flag: '', q: '' }; go('list'); }; });
}

/* =========================================================
   화면: 행사목록
   ========================================================= */
async function viewList() {
  const p = period();
  await ensure(p.from, p.to);
  let D = scopeRecs(p.from, p.to).map(derive);
  const lf = S.lf;
  if (lf.status) D = D.filter(d => d.r.status === lf.status);
  if (HV()) lf.verdict = '';
  if (lf.verdict === 'ok') D = D.filter(d => d.ok > 0);
  if (lf.verdict === 'no') D = D.filter(d => d.no > 0);
  if (lf.verdict === 'na') D = D.filter(d => d.na > 0);
  if (lf.flag === 'proof') D = D.filter(d => d.noEv || d.noInv);
  if (lf.flag === 'res') D = D.filter(d => d.noRes);
  if (lf.flag === 'late') D = D.filter(d => d.late);
  if (lf.q) { const q = lf.q.toLowerCase(); D = D.filter(d => (d.r.store + d.r.dealer + d.lines.map(l => l.product).join()).toLowerCase().includes(q)); }
  D.sort((a, b) => (b.r.start || '').localeCompare(a.r.start || '') || (b.r.updatedAt || '').localeCompare(a.r.updatedAt || ''));
  const admin = (S.user || {}).role === 'admin';
  const selectable = new Set(admin ? D.filter(d => d.r.status === '승인').map(d => d.r.id) : []);
  const sel = (id, opts, v) => `<select id="${id}">${opts.map(([k, t]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  $('#main').innerHTML = `
  ${filterBar(`
    ${sel('lStatus', [['', '상태 전체'], ...STATUSES.map(s => [s, stl(s)])], lf.status)}
    ${HV() ? '' : sel('lVerdict', [['', '판정 전체'], ['ok', '지원 포함'], ['no', '불가 포함'], ['na', '미판정 포함']], lf.verdict)}
    ${sel('lFlag', [['', '점검 항목 전체'], ['proof', '증빙 누락'], ['res', '결과 미입력'], ['late', '종료 후 결과 미입력']], lf.flag)}
    <input type="search" id="lQ" placeholder="점포·품목 검색" value="${esc(lf.q)}" style="width:150px">`)}
  ${admin ? (() => { const n = [...S.sel].filter(id => selectable.has(id)).length; return `<div class="bulk ${n ? '' : 'hide'}" id="bulk"><b>${n}건 선택</b><span class="hspace"></span><button class="btn sm good" id="bkOk">✓ 선택 최종승인</button><button class="btn sm bad" id="bkNo" style="background:#fff">✕ 선택 반려</button><button class="btn sm" id="bkClr" style="background:transparent;color:#fff;border-color:#666">선택 해제</button></div>`; })() : ''}
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="muted">${D.length}건${admin && selectable.size ? ` · <label style="cursor:pointer"><input type="checkbox" id="ckAll" ${[...selectable].every(id => S.sel.has(id)) ? 'checked' : ''}> 최종승인 대기 ${selectable.size}건 모두 선택</label>` : ''}</span><button class="btn pri" onclick="openForm()">+ 행사계획 등록</button></div>
  ${D.length ? `<div class="lst">${D.map(d => {
    const r = d.r;
    return `<div class="card it" data-id="${r.id}">
      <div class="t">${selectable.has(r.id) ? `<input type="checkbox" class="ck" data-ck="${r.id}" ${S.sel.has(r.id) ? 'checked' : ''} title="최종 결재 선택">` : ''}<div style="flex:1;min-width:0"><div class="nm">${esc(r.store)}</div><div class="meta">${esc(r.dealer)} · ${esc(d.di.o)} · ${esc(r.start)} ~ ${esc(r.end)}</div></div>${stChip(r.status)}</div>
      <div class="meta" style="margin-top:6px">${d.lines.slice(0, 3).map(l => esc(l.product || '(품목 없음)')).join(', ')}${d.lines.length > 3 ? ` 외 ${d.lines.length - 3}` : ''}</div>
      ${r.review && r.status !== '계획' ? `<div class="meta" style="margin-top:4px">담당 ${esc(r.review.by)}: ${esc(stl(r.review.result))}${r.review.comment ? ' · ' + esc(r.review.comment) : ''}</div>` : ''}
      ${r.final ? `<div class="meta">관리자: ${esc(stl(r.final.result))}${r.final.comment ? ' · ' + esc(r.final.comment) : ''}</div>` : ''}
      <div class="bd">
        ${HV() ? `<span class="b na">품목 ${d.lines.length}개</span>` : `${d.ok ? `<span class="b ok">✓ 지원 ${d.ok}</span>` : ''}${d.no ? `<span class="b no">✕ 불가 ${d.no}</span>` : ''}${d.na ? `<span class="b na">– 미판정 ${d.na}</span>` : ''}`}
        ${d.noEv || d.noInv ? `<span class="b wa">⚠ 증빙 ${d.noEv && d.noInv ? '없음' : d.noEv ? '행사사진 없음' : '명세서 없음'}</span>` : ''}
        ${d.late ? `<span class="b no">⏱ 결과 미입력</span>` : d.noRes ? `<span class="b na">결과 대기</span>` : ''}
        ${r.dummy ? `<span class="b na">더미</span>` : ''}
      </div></div>`;
  }).join('')}</div>` : `<div class="card empty">이 기간에 등록된 행사계획이 없습니다.<br><br><button class="btn pri" onclick="openForm()">+ 행사계획 등록</button></div>`}`;
  bindFilterBar();
  $('#lStatus').onchange = e => { lf.status = e.target.value; render(); };
  if ($('#lVerdict')) $('#lVerdict').onchange = e => { lf.verdict = e.target.value; render(); };
  $('#lFlag').onchange = e => { lf.flag = e.target.value; render(); };
  $('#lQ').oninput = e => { lf.q = e.target.value; clearTimeout(viewList._t); viewList._t = setTimeout(() => { render().then(() => { const q = $('#lQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }); }, 300); };
  $$('.it').forEach(c => c.onclick = e => { if (e.target.closest('.ck')) return; openDetail(c.dataset.id); });
  $$('.ck').forEach(c => c.onchange = () => { c.checked ? S.sel.add(c.dataset.ck) : S.sel.delete(c.dataset.ck); render(); });
  const all = $('#ckAll'); if (all) all.onchange = () => { selectable.forEach(id => all.checked ? S.sel.add(id) : S.sel.delete(id)); render(); };
  const picked = () => [...S.sel].filter(id => selectable.has(id)).map(id => S.recs.get(id));
  const bulk = async (status) => {
    const rs = picked(); if (!rs.length) return;
    let comment = '';
    if (status === '반려') { comment = (prompt(`선택한 ${rs.length}건을 반려합니다. 반려 사유를 적어주세요.`) || '').trim(); if (!comment) return toast('반려 사유가 없어 취소했습니다'); }
    else if (!confirm(`선택한 ${rs.length}건을 최종승인할까요?\n(담당 ${[...new Set(rs.map(r => dinfo(r.dealer).o))].join(', ')})`)) return;
    busy(true);
    try { const out = await Repo.setStatusMany(rs, status, comment); out.forEach(n => S.recs.set(n.id, n)); S.sel.clear(); toast(`${out.length}건 ${stl(status)} 처리했습니다`); render(); }
    catch (e) { toast('처리 실패: ' + e.message, 5000); } finally { busy(false); }
  };
  const on = (id, fn) => { const e = $('#' + id); if (e) e.onclick = fn; };
  on('bkOk', () => bulk('최종승인')); on('bkNo', () => bulk('반려')); on('bkClr', () => { S.sel.clear(); render(); });
}

/* =========================================================
   모달 공통
   ========================================================= */
function modal(html) { const o = $('#ov'); o.innerHTML = `<div class="md">${html}</div>`; o.classList.add('on'); o.scrollTop = 0; document.body.style.overflow = 'hidden'; }
function closeModal() { const o = $('#ov'); o.classList.remove('on'); o.innerHTML = ''; document.body.style.overflow = ''; }
$('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov' && !$('#ov .md form')) closeModal(); });
function lightbox(src) { const l = $('#lb'); l.querySelector('img').src = src; l.classList.add('on'); }
async function fillThumbs(root) {
  for (const im of $$('img[data-ph]', root)) {
    try { const s = await Repo.src(im.dataset.ph); if (s) { im.src = s; im.parentElement.onclick = ev => { if (!ev.target.closest('.rm')) lightbox(s); }; } else im.alt = '없음'; } catch (e) { im.alt = '불러오기 실패'; }
  }
}

/* =========================================================
   등록 / 수정 폼
   ========================================================= */
let F = null, FBase = null;
function blankLine() { return { product: '', pack: '', qty: '', unit: 'box', inPrice: '', salePrice: '', sold: '' }; }
function canEditPlan(r) {
  const u = S.user || {};
  if (u.role === 'admin') return true;
  if (r.status === '마감' || r.status === '최종승인') return false;
  if (u.role === 'dealer') return r.status === '계획' || r.status === '반려';
  return true;
}
function openForm(id) {
  const u = S.user || {};
  if (!S.user) return openUser();
  const src = id ? S.recs.get(id) : null;
  if (src && src.status === '마감' && u.role !== 'admin') return toast('마감된 행사는 관리자만 수정할 수 있습니다');
  if (src && src.status === '최종승인' && u.role === 'owner') return toast('최종승인된 행사는 관리자만 수정할 수 있습니다');
  F = src ? JSON.parse(JSON.stringify(src)) : {
    id: uid(), month: '', dealer: u.role === 'dealer' ? u.name : (S.f.dealer || ''), store: '', addr: '',
    start: '', end: '', lines: [blankLine()], photos: { event: [], invoice: [] }, memo: '', status: '계획',
    createdAt: new Date().toISOString(), createdBy: userLabel()
  };
  F.photos = F.photos || { event: [], invoice: [] };
  FBase = src ? src.updatedAt : null;
  const lockPlan = src ? !canEditPlan(src) : false;
  F._lock = lockPlan;
  const dl = u.role === 'dealer' ? [u.name] : (u.role === 'owner' ? dealersOf(u.name) : dealersOf());
  modal(`<form id="pf" onsubmit="return false">
  <div class="mh"><h2>${src ? '행사계획 수정' : '행사계획 등록'}</h2>${src ? stChip(F.status) : ''}<button type="button" class="x" onclick="closeModal()">×</button></div>
  <div class="mb">
    ${lockPlan ? `<div class="warnbox" style="margin:0 0 12px">${esc(stl(F.status))}된 계획이라 ① 계획 내용은 잠겨 있어요. ② 증빙과 ③ 결과만 입력할 수 있습니다.</div>` : ''}
    <div class="fs"><h4><span class="n">1</span>계획</h4>
      <div class="fg">
        <label class="f"><span>대리점 <b>*</b></span><select data-f="dealer" ${lockPlan || u.role === 'dealer' ? 'disabled' : ''}><option value="">선택</option>${dl.map(d => `<option ${F.dealer === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}${F.dealer && !dl.includes(F.dealer) ? `<option selected>${esc(F.dealer)}</option>` : ''}</select></label>
        <label class="f span2"><span>점포 <b>*</b> <span class="faint" style="font-weight:400">목록에서 고르거나 직접 입력</span></span><input type="text" data-f="store" list="dl-store" value="${esc(F.store)}" placeholder="점포명 검색" ${lockPlan ? 'disabled' : ''} autocomplete="off"><datalist id="dl-store"></datalist></label>

function bindForm() {

function compress(file, maxSide = 1280, q = 0.72) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => no(new Error('이미지를 읽을 수 없습니다'));
    img.src = url;
  });
}
async function submitForm() {

  F.lines = F.lines.filter(l => l.product || l.qty || l.inPrice || l.salePrice);
  if (!F.lines.length) { F.lines = [blankLine()]; renderLines(); err.push('품목 1개 이상'); }
  if (err.length) return toast('필수 입력: ' + err.join(', '));
  F.store = F.store.trim(); F.month = F.start.slice(0, 7);
  const u = S.user || {};
  if (u.role === 'dealer' && F.status === '반려') F.status = '계획';
  const rec = { ...F }; delete rec._lock;
  $('#fSave').disabled = true; $('#fMsg').innerHTML = '<span class="spin"></span> 저장 중…';
  try {
    const j = await Repo.save(rec, FBase);
    if (j.conflict) {
      S.recs.set(j.server.id, j.server); $('#fSave').disabled = false; $('#fMsg').textContent = '';
      return toast('다른 사용자가 먼저 수정했습니다. 최신 내용을 불러왔으니 다시 입력해 주세요.', 5000), openForm(j.server.id);
    }

    if (S.per.to !== j.rec.month && S.per.mode === 'm') S.per.to = j.rec.month;
    if (S.view === 'new') S.view = 'list';

    if (API.on && /fetch|network|Failed/i.test(e.message)) { pushOutbox(rec); S.recs.set(rec.id, rec); closeModal(); toast('네트워크 오류로 기기에 임시 보관했습니다. 연결되면 [다시 보내기]를 누르세요.', 5000); render(); }
    else { $('#fSave').disabled = false; $('#fMsg').textContent = ''; toast('저장 실패: ' + e.message, 5000); }
  }
}

async function exportXlsx(A, label) {
  const rows = A.lines.map(l => ({
    '월': l.d.r.month, '대리점': l.d.r.dealer, '담당': l.d.di.o, '권역': l.d.di.g, '점포': l.d.r.store, '주소': l.d.r.addr || '',
    '행사시작': l.d.r.start, '행사종료': l.d.r.end, '상태': stl(l.d.r.status), '품목': l.product, '판매입수': num(l.pack),
    '입고수량': num(l.qty), '수량단위': l.unit === 'ea' ? '낱개' : '박스', '점포입고가': num(l.inPrice), '소비자판매가(행사)': num(l.salePrice),
    '정상소비자가': l.c.normal != null ? Math.round(l.c.normal) : null, '출고가': l.c.out != null ? Math.round(l.c.out) : null,
    '행사율': l.c.rate, '행사율구간': l.c.band || '', '대리점마진율': l.c.margin, '판정': l.c.verdict, '판정사유': l.c.reasons.join(', '),
    '판매수량': num(l.sold), '입고(낱개)': l.c.qtyEa, '판매(낱개)': l.c.soldEa, '회전율': l.c.turn,
    '행사사진': (l.d.r.photos?.event || []).length, '거래명세서': (l.d.r.photos?.invoice || []).length, '담당점검': l.d.r.review ? stl(l.d.r.review.result) + ' (' + l.d.r.review.by + ')' : '', '담당의견': l.d.r.review?.comment || '', '최종결재': l.d.r.final ? stl(l.d.r.final.result) + ' (' + l.d.r.final.by + ')' : '', '관리자의견': l.d.r.final?.comment || ''
  }));
  const dealer = A.byDealer.filter(r => r.recs > 0).map(r => ({ '대리점': r.dealer, '담당': r.owner, '권역': r.region, '참여점포': r.stores, '품목수': r.products, '행사건': r.recs, '지원': r.ok, '불가': r.no, '입고(낱개)': r.qty, '판매(낱개)': r.sold, '회전율': r.turn, '입고금액': r.inAmt }));
  const owner = A.byOwner.map(r => ({ '담당': r.owner, '참여대리점': r.part, '담당대리점': r.total, '참여율': r.rate, '참여점포': r.stores, '행사건': r.recs, '회전율': r.turn }));
  const prod = A.byProduct.map(r => ({ '품목': r.product, '참여점포': r.stores, '참여대리점': r.dealers, '지원': r.ok, '불가': r.no, '평균행사율': r.rate, '입고(낱개)': r.qty, '판매(낱개)': r.sold, '회전율': r.turn }));
  if (HV()) { const strip = o => { delete o['판정']; delete o['판정사유']; delete o['지원']; delete o['불가']; return o; }; rows.forEach(strip); dealer.forEach(strip); prod.forEach(strip); }
  const fname = `행사계획_${label.replace(/[\s~.]+/g, '_')}`;
  try {
    busy(true); await loadScript(CDN.xlsx);
    const wb = XLSX.utils.book_new();
    const add = (name, data, pctCols) => {
      const ws = XLSX.utils.json_to_sheet(data.length ? data : [{ '안내': '데이터 없음' }]);
      if (data.length) {
        const head = Object.keys(data[0]);
        ws['!cols'] = head.map(h => ({ wch: Math.max(8, Math.min(40, h.length * 2 + 2, ...data.slice(0, 200).map(r => String(r[h] ?? '').length + 2))) }));
        pctCols.forEach(h => { const ci = head.indexOf(h); if (ci < 0) return; for (let ri = 1; ri <= data.length; ri++) { const c = ws[XLSX.utils.encode_cell({ r: ri, c: ci })]; if (c && typeof c.v === 'number') c.z = '0.0%'; } });
      }
      XLSX.utils.book_append_sheet(wb, ws, name);
    };
    add('행사품목', rows, ['행사율', '대리점마진율', '회전율']);
    add('대리점별', dealer, ['회전율']); add('담당별', owner, ['참여율', '회전율']); add('품목별', prod, ['평균행사율', '회전율']);
    XLSX.writeFile(wb, fname + '.xlsx');
  } catch (e) {
    // 오프라인일 때: CSV로 대체
    const head = Object.keys(rows[0] || { '안내': '' });
    const csv = '﻿' + [head.join(','), ...rows.map(r => head.map(h => { const v = r[h] ?? ''; return /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v; }).join(','))].join('\n');
    download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), fname + '.csv');
    toast('엑셀 라이브러리를 못 불러와 CSV로 저장했습니다');
  } finally { busy(false); }
}
async function exportImage(sel, name, kind) {
  const el = $(sel); if (!el) return;
  busy(true);
  try {
    await loadScript(CDN.h2c);
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#f4f3ef', useCORS: true, windowWidth: Math.max(1100, el.scrollWidth) });
    const safe = name.replace(/[\\/:*?"<>|\s~]+/g, '_');
    if (kind === 'jpg') { canvas.toBlob(b => download(b, safe + '.jpg'), 'image/jpeg', 0.92); }
    else {
      await loadScript(CDN.jspdf);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
      const pw = 210, ph = 297, m = 8, w = pw - m * 2;
      const pxPerMm = canvas.width / w, pageH = Math.floor((ph - m * 2) * pxPerMm);
      for (let y = 0, i = 0; y < canvas.height; y += pageH, i++) {
        const h = Math.min(pageH, canvas.height - y);
        const c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
        c.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
        if (i) pdf.addPage();
        pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', m, m, w, h / pxPerMm);
      }
      pdf.save(safe + '.pdf');
    }
  } catch (e) { toast('저장 실패: ' + e.message, 4000); }
  finally { busy(false); }
}

async function importMaster(file) {
  busy(true);
  try {
    await loadScript(CDN.xlsx);
    const wb = XLSX.read(await file.arrayBuffer());
    const sh = n => { const k = wb.SheetNames.find(x => x.replace(/\s/g, '').includes(n)); if (!k) throw new Error(`'${n}' 시트를 찾을 수 없습니다`); return XLSX.utils.sheet_to_json(wb.Sheets[k], { header: 1, defval: null }); };
    const D = sh('대리점구분'), ST = sh('주요점포'), P = sh('제품리스트');
    let PK = null; try { PK = sh('판매입수'); } catch (e) { }
    // 대리점구분: '대리점' 머리글 위치를 찾아 그 아래를 읽음
    let hr = -1, hc = -1; D.some((r, i) => { const c = (r || []).indexOf('대리점'); if (c >= 0) { hr = i; hc = c; return true; } });
    if (hr < 0) throw new Error("대리점구분 시트에 '대리점' 머리글이 없습니다");
    const dealers = D.slice(hr + 1).filter(r => r && r[hc] && !DEALER_ALIAS[String(r[hc]).trim()]).map(r => ({ n: String(r[hc]).trim(), o: String(r[hc + 1] || '').trim() || '미지정', g: String(r[hc + 2] || '').trim() || '미지정' }));
    // 주요점포: 번호, 점포명, 대리점, 동, (등급), 영업소, 비고, 담당, 주소 — 주소는 마지막 열
    const stores = ST.filter(r => r && r[1] && r[2] && !/점포명/.test(String(r[1]))).map(r => {
      const cells = r.map(v => v == null ? '' : String(v).replace(/\n/g, ' ').trim());
      let last = cells.length - 1; while (last > 2 && !cells[last]) last--;
      return { n: cells[1], d: DEALER_ALIAS[cells[2]] || cells[2], a: last > 3 && /(시|군|구|도)\s/.test(cells[last]) ? cells[last] : '' };
    });
    const products = P.filter(r => r && r[1] && num(r[0]) && num(r[2]) != null && num(r[4]) != null).map(r => ({ n: String(r[1]).trim(), q: num(r[0]), u: Math.round(num(r[2]) * 100) / 100, c: num(r[4]) }));
    const packs = PK ? [...new Set(PK.flat().map(v => num(String(v || '').replace('입', ''))).filter(v => v))].sort((a, b) => a - b) : S.master.packs;
    if (!dealers.length || !stores.length || !products.length) throw new Error('읽은 데이터가 비어 있습니다');
    const m = { ver: today(), dealers, stores, products, packs };
    if (!confirm(`대리점 ${dealers.length} · 점포 ${stores.length} · 제품 ${products.length} · 입수 ${packs.join('/')}\n이 내용으로 마스터를 바꿀까요?`)) return;
    setMaster(m); save('master', m);
    if (API.on) await API.call('setMaster', { master: m });
    toast('마스터를 갱신했습니다'); render();
  } catch (e) { toast('마스터 업로드 실패: ' + e.message, 5000); }
  finally { busy(false); $('#mFile') && ($('#mFile').value = ''); }
}
async function pullMaster() {
  if (!API.on) return;
  try { const j = await API.call('getMaster'); if (j.master && j.master.products) { setMaster(j.master); save('master', j.master); } } catch (e) { }
}
async function genDummy() {
  if (!confirm(`최근 3개월 더미 행사 약 60건을 ${API.on ? '구글시트에' : '이 기기에'} 만들까요?`)) return;
  busy(true);
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  const recs = [], now = new Date();
  const ds = [...S.dmap.values()].filter(d => !d.orphan);
  for (let mi = 2; mi >= 0; mi--) {
    const base = new Date(now.getFullYear(), now.getMonth() - mi, 1), m = ym(base);
    const pick = ds.filter(() => Math.random() < 0.45);
    for (const d of pick) {
      const sts = storesOf(d.n); if (!sts.length) continue;
      for (let n = 0; n < 1 + Math.floor(Math.random() * 2); n++) {
        const s = rnd(sts), sd = 1 + Math.floor(Math.random() * 18), ed = Math.min(sd + 6 + Math.floor(Math.random() * 7), 28);
        const lines = [];
        for (let j = 0; j < 1 + Math.floor(Math.random() * 3); j++) {
          const p = rnd(S.master.products), k = Math.random() < 0.15 ? rnd(S.master.packs) : p.q;
          const normal = p.c / p.q * k, out = p.u * k;
          const rate = rnd([0.08, 0.15, 0.2, 0.22, 0.25, 0.3, 0.33, 0.4, 0.45, 0.52]);
          const mg = rnd([0.06, 0.08, 0.1, 0.12, 0.14, 0.15, 0.18, 0.22]);
          const qty = 2 + Math.floor(Math.random() * 20);
          const done = mi > 0 || Math.random() < 0.3;
          lines.push({ product: p.n, pack: String(k), qty: String(qty), unit: 'box', inPrice: String(Math.round(out / (1 - mg) / 10) * 10), salePrice: String(Math.round(normal * (1 - rate) / 10) * 10), sold: done ? String(Math.round(qty * (0.4 + Math.random() * 0.6))) : '' });
        }
        const status = mi > 0 ? rnd(['마감', '마감', '최종승인', '반려']) : rnd(['계획', '계획', '승인', '승인', '최종승인', '반려']);
        const at = new Date().toISOString();
        const review = status !== '계획' ? { by: d.o, at, result: status === '반려' ? '반려' : '승인', comment: status === '반려' ? '행사가 재확인 필요' : '' } : null;
        const final = ['최종승인', '마감'].includes(status) ? { by: '관리자', at, result: '최종승인', comment: '' } : null;
        recs.push({ final, log: [], id: uid(), dummy: true, month: m, dealer: d.n, store: s.n, addr: s.a, start: `${m}-${String(sd).padStart(2, '0')}`, end: `${m}-${String(ed).padStart(2, '0')}`, lines, photos: { event: [], invoice: [] }, memo: '', status, review, createdAt: new Date().toISOString(), createdBy: d.n, updatedBy: '더미' });
      }
    }
  }
  try { await Repo.saveMany(recs); S.recs.clear(); S.loaded.clear(); toast(`더미 ${recs.length}건 생성`); go('dash'); }
  catch (e) { toast('생성 실패: ' + e.message); } finally { busy(false); }
}

/* =========================================================
   사용자 선택
   ========================================================= */
function openUser() {
  const u = S.user || { role: 'dealer', name: '' };
  const secure = API.on;
  modal(`<div class="mh"><h2>${secure ? '로그인' : '사용자 선택'}</h2>${S.user ? '<button class="x" onclick="closeModal()">×</button>' : ''}</div>
  <div class="mb"><div class="fs">
    <div class="seg" id="uRole" style="margin-bottom:12px"><button data-r="dealer">대리점</button><button data-r="owner">영업담당</button><button data-r="admin">관리자</button></div>
    <label class="f" id="uNameWrap"><span id="uNameL">이름</span><select id="uName"></select><input type="text" id="uNameT" class="hide" placeholder="사용자 탭에 등록된 이름"></label>
    ${secure ? `<label class="f" style="margin-top:10px"><span>비밀번호</span><input type="password" id="uPin" inputmode="numeric" autocomplete="current-password" placeholder="관리자에게 받은 비밀번호"></label>` : ''}
    <div id="uErr" class="small" style="color:var(--bad-t);margin-top:8px"></div>
    ${secure ? `<details id="uConn" style="margin-top:10px"><summary class="small muted" style="cursor:pointer">연결 설정 (URL·토큰 변경)</summary>
      <label class="f" style="margin-top:8px"><span>Apps Script 웹 앱 URL</span><input type="url" id="ucUrl" value="${esc(S.cfg.url)}"></label>
      <label class="f" style="margin-top:6px"><span>토큰 (Code.gs의 TOKEN 값)</span><input type="text" id="ucTok" value="${esc(S.cfg.token)}"></label>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="ucSave">저장 후 연결 확인</button><button class="btn sm" id="ucDef">기본값으로</button></div>
    </details>` : ''}
    <p class="note" style="margin-top:10px">• 대리점: 자기 대리점 계획만 등록·조회<br>• 영업담당: 대리점 계획을 점검(승인/반려)<br>• 관리자: 담당 승인건 최종승인·반려, 전체 수정, 마스터 관리
    ${secure ? '<br>• 비밀번호는 구글시트 [사용자] 탭에서 관리자가 관리합니다' : '<br>• 로컬 모드라 비밀번호 없이 들어갑니다 (이 기기에만 저장)'}</p>
  </div></div>
  <div class="mf">${S.user ? '<button class="btn" id="uOut">로그아웃</button>' : ''}${secure ? '<button class="btn" id="uCheck">연결 확인</button>' : ''}<span class="hspace"></span><button class="btn pri" id="uOk">${secure ? '로그인' : '확인'}</button></div>`);
  let role = u.role;
  const draw = () => {
    $$('#uRole button').forEach(b => b.classList.toggle('on', b.dataset.r === role));
    const admin = role === 'admin';
    $('#uName').classList.toggle('hide', admin);
    $('#uNameT').classList.toggle('hide', !admin);
    $('#uNameWrap').classList.toggle('hide', admin && !secure);
    $('#uNameL').textContent = role === 'dealer' ? '대리점' : role === 'owner' ? '담당자' : '관리자 이름';
    if (admin) $('#uNameT').value = u.role === 'admin' ? u.name : '관리자';
    const opts = role === 'dealer' ? dealersOf() : owners();
    $('#uName').innerHTML = opts.map(o => `<option ${u.name === o ? 'selected' : ''}>${esc(o)}</option>`).join('');
  };
  $$('#uRole button').forEach(b => b.onclick = () => { role = b.dataset.r; $('#uErr').textContent = ''; draw(); });
  draw();
  const out = $('#uOut'); if (out) out.onclick = () => { S.user = null; save('user', null); S.recs.clear(); S.loaded.clear(); updUser(); openUser(); };
  const done = (user) => {
    S.user = user; save('user', user);
    S.f = { region: '', owner: user.role === 'owner' ? user.name : '', dealer: '' };
    S.recs.clear(); S.loaded.clear();
    closeModal(); updUser(); render();
  };
  const submit = async () => {
    const name = role === 'admin' ? ($('#uNameT').value.trim() || '관리자') : $('#uName').value;
    if (!secure) return done({ role, name: role === 'admin' ? '관리자' : name });
    const pin = $('#uPin').value.trim();
    if (!pin) return $('#uErr').textContent = '비밀번호를 입력하세요';
    $('#uOk').disabled = true; $('#uErr').innerHTML = '<span class="spin"></span> 확인 중';
    try { await API.call('login', { auth: { role, name, pin } }); done({ role, name, pin }); }
    catch (e) { $('#uErr').innerHTML = loginHelp(e.message); $('#uOk').disabled = false; if (/토큰|fetch|Failed|서버 응답|알 수 없는 요청/i.test(e.message) && $('#uConn')) $('#uConn').open = true; }
  };
  const ucs = $('#ucSave'); if (ucs) ucs.onclick = () => {
    const url = $('#ucUrl').value.trim(), token = $('#ucTok').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) return $('#uErr').innerHTML = loginHelp('URL 형식 오류') + '<div class="warnbox" style="margin-top:6px">URL은 https://script.google.com/macros/s/…/exec 형태여야 합니다.</div>';
    S.cfg = { url, token }; save('cfg', S.cfg); updConn(); $('#uCheck').click();
  };
  const ucd = $('#ucDef'); if (ucd) ucd.onclick = () => { $('#ucUrl').value = DEFAULT_CFG.url; $('#ucTok').value = DEFAULT_CFG.token; };
  const ck = $('#uCheck'); if (ck) ck.onclick = async () => {
    $('#uErr').innerHTML = '<span class="spin"></span> 연결 확인 중';
    try {
      const j = await API.call('ping');
      if (!j.version) $('#uErr').innerHTML = loginHelp('알 수 없는 요청: login');
      else if (!j.users) $('#uErr').innerHTML = loginHelp('사용자가 등록되어 있지 않습니다');
      else $('#uErr').innerHTML = `<span style="color:var(--good-t)">✓ 연결 정상 · ${esc(j.name)} · 등록 사용자 ${j.users}명</span><br>그래도 로그인이 안 되면 시트 [사용자] 탭의 구분·이름·비밀번호를 확인하세요.`;
    } catch (e) { $('#uErr').innerHTML = loginHelp(e.message); if ($('#uConn')) $('#uConn').open = true; }
  };
  $('#uOk').onclick = submit;
  const pinEl = $('#uPin'); if (pinEl) pinEl.onkeydown = e => { if (e.key === 'Enter') submit(); };
}
function loginHelp(msg) {
  const m = String(msg || '');
  let tip = '';
  if (/알 수 없는 요청|login/.test(m) && !/비밀번호|등록/.test(m)) tip = '구글시트의 Apps Script가 아직 <b>예전 버전</b>입니다. 새 Code.gs로 교체·저장한 뒤 <b>[배포] → [배포 관리] → 연필 → 버전: 새 버전 → [배포]</b>를 해주세요.';
  else if (/등록되어 있지 않/.test(m)) tip = 'Apps Script에서 <b>사용자_초기화</b> 함수를 실행했는지, [사용자] 탭의 <b>구분(대리점/영업담당/관리자)과 이름</b>이 정확한지 확인하세요.';
  else if (/비밀번호가 맞지/.test(m)) tip = '[사용자] 탭에서 바꾼 비밀번호를 다시 확인하세요. 칸에 공백·소수점(예: 1234.0)이 들어가지 않았는지도 봐주세요.';
  else if (/잠겼/.test(m)) tip = '10분 뒤 다시 시도하세요.';
  else if (/토큰/.test(m)) tip = 'Code.gs 맨 위 TOKEN 값이 <b>5593445</b>인지 확인하세요. 바꿨다면 앱 [설정]의 토큰도 같게 맞춰야 합니다.';
  else if (/fetch|network|Failed|서버 응답/i.test(m)) tip = '인터넷 연결이나 웹 앱 URL을 확인하세요. 배포 시 액세스 권한이 <b>모든 사용자</b>인지도 확인하세요.';
  return esc(m) + (tip ? `<div class="warnbox" style="margin-top:6px">${tip}</div>` : '');
}
function roleName(u) { return u.role === 'admin' ? `관리자${u.name && u.name !== '관리자' ? ' · ' + u.name : ''}` : u.role === 'owner' ? `영업담당 · ${u.name}` : `대리점 · ${u.name}`; }
function updUser() { $('#userChip').textContent = S.user ? roleName(S.user) : '사용자 선택'; }
function updConn() { const c = $('#conn'); c.className = 'conn ' + (API.on ? 'on' : 'off'); c.textContent = API.on ? '구글시트 연결' : '로컬 저장'; c.title = API.on ? S.cfg.url : '이 기기에만 저장됩니다'; }

/* =========================================================
   라우팅
   ========================================================= */
function go(v) { S.view = v; render(); }
async function render() {
  if (!S.user) { $('#main').innerHTML = '<div class="card empty">로그인 후 이용할 수 있습니다.<br><br><button class="btn pri" onclick="openUser()">로그인</button></div>'; return; }
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  const ob = outbox();
  if (S.view === 'dash') await viewDash();
  else if (S.view === 'list') await viewList();
  else if (S.view === 'set') viewSet();
  else if (S.view === 'new') { S.view = 'list'; await viewList(); $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === 'new')); openForm(); }
  if (ob.length && S.view !== 'set') $('#main').insertAdjacentHTML('afterbegin', `<div class="outbox">⚠ 서버로 못 보낸 저장 ${ob.length}건이 이 기기에 있습니다 <button class="btn sm" onclick="flushOutbox()">다시 보내기</button></div>`);
}
$$('#tabs button').forEach(b => b.onclick = () => go(b.dataset.v));

(async function init() {
  const lm = load('master', null);
  setMaster(lm && lm.products && (!EMBED_MASTER || (lm.ver || '') >= (EMBED_MASTER.ver || '')) ? lm : EMBED_MASTER);
  if (API.on && S.user && !S.user.pin) { S.user = null; save('user', null); }
  updUser(); updConn();
  if (S.user && S.user.role === 'owner') S.f.owner = S.user.name;
  if (API.on) pullMaster().then(() => S.view === 'set' && render());
  if (!S.user) { $('#main').innerHTML = '<div class="card empty">로그인 후 이용할 수 있습니다.<br><br><button class="btn pri" onclick="openUser()">로그인</button></div>'; return openUser(); }
  await render();
})();
</script>
